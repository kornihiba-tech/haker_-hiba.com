<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>تسجيل الدخول</h2>

        <form>
            <label for="phone">رقم الهاتف</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="أدخل رقم هاتفك"
                autocomplete="tel"
                required
            >

            <label for="password">كلمة السر</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="أدخل كلمة السر"
                autocomplete="current-password"
                required
            >

            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>

</body>
</html>
